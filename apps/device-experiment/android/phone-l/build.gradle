plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.leqi.experiment.phonel'
    compileSdk { version = release(36) { it.minorApiLevel = 1 } }
    defaultConfig {
        applicationId 'com.leqi.experiment.phonel'
        minSdk 31
        targetSdk 35
        versionCode 15
        versionName '0.8.3'
        buildConfigField 'boolean', 'DEVELOPER_TOOLS', providers.gradleProperty('leqiDeveloperTools').map { it.toBoolean().toString() }.getOrElse('false')
        def sourceRevision = providers.gradleProperty('leqiSourceRevision').getOrElse('unknown')
        if (!(sourceRevision ==~ /[0-9a-f]{7,40}|unknown/)) throw new GradleException('Invalid leqiSourceRevision')
        buildConfigField 'String', 'SOURCE_REVISION', '"' + sourceRevision + '"'
        manifestPlaceholders = [amapAndroidKey: rootProject.amapKeyFor('PHONEL')]
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig = true }
    testOptions.unitTests.all {
        // Robolectric 不展开 Maven settings.xml 中的 ${user.home}；使用确定的本地缓存路径。
        systemProperty 'maven.repo.local', new File(gradle.gradleUserHomeDir, 'caches/robolectric').absolutePath
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Explicit migration to the API verified in the official CXR-L 1.1.2 Sample.
dependencies {
    implementation 'com.rokid.cxr:client-l:1.1.2'
    implementation 'com.amap.api:navi-3dmap-location-search:11.3.100_3dmap11.3.100_loc11.3.000_sea9.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}

// 由源码生成资源，手机端与 CXR-L 端始终执行同一份仓库 Agent。
def repoRoot = rootProject.file('../../..')
def agentAssets = layout.buildDirectory.dir('generated/agentAssets')
// src/main/assets 属于旧本地推理实验。纯云包只装入当前 Agent，依赖库自带的资源由 AGP 合并。
android.sourceSets.main.assets.setSrcDirs([agentAssets])
tasks.register('bundleAgent', Exec) {
    inputs.files(fileTree(repoRoot) {
        include 'apps/phone-companion/src/**/*.ts'
        include 'packages/**/*.ts'
        include 'packages/**/*.json'
        include 'tools/build-mobile-agent.mjs'
        include 'apps/phone-companion/android/src/main/assets/agent/index.html'
        exclude '**/node_modules/**'
    })
    outputs.dir(agentAssets)
    commandLine 'node', new File(repoRoot, 'tools/build-mobile-agent.mjs').absolutePath,
        '--outdir', new File(agentAssets.get().asFile, 'agent').absolutePath
}
tasks.named('preBuild').configure { dependsOn 'bundleAgent' }

// 只共享设备适配器；不引入旧蓝牙宿主或第二套任务状态机。
def sharedSources = layout.buildDirectory.dir('generated/sharedSources')
android.sourceSets.main.java.srcDir(sharedSources)
tasks.register('syncAgentPorts', Sync) {
    from('../common/src/main/java') { include 'com/leqi/experiment/CxrlInputGate.kt' }
    from('../../../phone-companion/android/src/main/java') {
        include 'com/leqi/experiment/phonebt/AgentRuntimeWebView.kt'
        include 'com/leqi/experiment/phonebt/AgentNavigationDevice.kt'
        include 'com/leqi/experiment/phonebt/Amap*.kt'
        include 'com/leqi/experiment/phonebt/PhoneLocationAdapter.kt'
    }
    into sharedSources
}
tasks.named('preBuild').configure { dependsOn 'syncAgentPorts' }

// Kotlin 编译任务单独配置排除项，保证旧本地诊断代码不进入 APK。
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude '**/BundledModel.kt', '**/GemmaObservation.kt', '**/SpeechModels.kt',
        '**/SpeechDialogue.kt', '**/PhoneSpeechAudio.kt', '**/PhoneLActivity.kt', '**/CxrlSessionProbe.kt',
        '**/BundledModelTest.kt', '**/SpeechDialogueTest.kt', '**/CxrlSessionProbeTest.kt'
}
