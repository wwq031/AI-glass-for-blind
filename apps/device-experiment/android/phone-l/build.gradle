plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def gemmaEnabled = providers.gradleProperty('cxrlGemma').map { it.toBoolean() }.getOrElse(false)
def gemmaCodeOnly = providers.gradleProperty('gemmaCodeOnly').map { it.toBoolean() }.getOrElse(false)
def speechEnabled = providers.gradleProperty('cxrlSpeech').map { it.toBoolean() }.getOrElse(false)
if (speechEnabled && !gemmaEnabled) throw new GradleException('Speech dialogue requires -PcxrlGemma=true')

android {
    namespace 'com.leqi.experiment.phonel'
    compileSdk { version = release(36) { it.minorApiLevel = 1 } }
    defaultConfig {
        applicationId 'com.leqi.experiment.phonel'
        minSdk 31
        targetSdk 35
        versionCode speechEnabled ? 7 : gemmaEnabled ? 6 : 3
        versionName speechEnabled ? '0.4.2' : gemmaEnabled ? '0.3.1' : '0.2.1'
        buildConfigField 'boolean', 'GEMMA_ENABLED', gemmaEnabled.toString()
        buildConfigField 'boolean', 'SPEECH_ENABLED', speechEnabled.toString()
        ndk { abiFilters 'arm64-v8a' }
        def sourceRevision = providers.gradleProperty('leqiSourceRevision').getOrElse('unknown')
        if (!(sourceRevision ==~ /[0-9a-f]{7,40}|unknown/)) throw new GradleException('Invalid leqiSourceRevision')
        buildConfigField 'String', 'SOURCE_REVISION', '"' + sourceRevision + '"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig = true }
    // Lossless compression reduces download size; full multimodal releases may need transport parts.
    androidResources { if (!speechEnabled) noCompress += ['modelpart'] }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Explicit migration to the API verified in the official CXR-L 1.1.2 Sample.
dependencies {
    implementation 'com.rokid.cxr:client-l:1.1.2'
    implementation project(':gemma-runtime')
    implementation files(rootProject.file('../../phone-companion/android/libs/sherpa-onnx-1.13.8.aar'))
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}

// Large weights stay out of Git. Split assets keep individual ZIP entries bounded.
def generatedModelAssets = layout.buildDirectory.dir('generated/gemmaAssets')
tasks.register('prepareGemmaAssets') {
    def modelPath = providers.gradleProperty('gemmaModelPath')
    inputs.property('enabled', gemmaEnabled)
    inputs.property('codeOnly', gemmaCodeOnly)
    if (gemmaEnabled && !gemmaCodeOnly && modelPath.isPresent()) inputs.file(modelPath)
    outputs.dir(generatedModelAssets)
    doLast {
        def target = generatedModelAssets.get().asFile
        delete target
        target.mkdirs()
        if (!gemmaEnabled || gemmaCodeOnly) return
        if (!modelPath.isPresent()) throw new GradleException('Full Gemma APK requires -PgemmaModelPath=<verified multimodal .litertlm>; use -PgemmaCodeOnly=true only for CI.')
        def source = file(modelPath.get())
        def expected = '181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c'
        if (source.length() != 2588147712L) throw new GradleException('Expected complete Gemma multimodal model; GPU-only bundle has no vision encoder')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def parts = []
        def root = new File(target, 'gemma'); root.mkdirs()
        source.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            long remaining = source.length()
            int index = 0
            while (remaining > 0) {
                def name = String.format('weights-%03d.modelpart', index++)
                long partSize = Math.min(256L * 1024 * 1024, remaining)
                new File(root, name).withOutputStream { output ->
                    long written = 0
                    while (written < partSize) {
                        int read = input.read(buffer, 0, (int)Math.min(buffer.length, partSize - written))
                        if (read < 0) throw new GradleException('Truncated Gemma model')
                        output.write(buffer, 0, read); digest.update(buffer, 0, read); written += read
                    }
                }
                parts.add([name: name, bytes: partSize]); remaining -= partSize
            }
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != expected) { delete root; throw new GradleException('Gemma model SHA-256 mismatch') }
        new File(root, 'manifest.json').text = groovy.json.JsonOutput.toJson([
            model: 'gemma-4-E2B-it.litertlm', bytes: source.length(), sha256: expected,
            revision: 'b3ca0d2f076785a8f4b2219ddbd2bdb99954eae1', parts: parts])
    }
}
android.sourceSets.main.assets.srcDir(generatedModelAssets)
tasks.named('preBuild').configure { dependsOn 'prepareGemmaAssets' }

def speechLock = rootProject.file('../../../tools/cxrl-speech-models.lock.json')
def generatedSpeechAssets = layout.buildDirectory.dir('generated/speechAssets')
tasks.register('prepareSpeechAssets') {
    def modelRoot = providers.gradleProperty('speechModelRoot')
    inputs.file(speechLock)
    inputs.property('enabled', speechEnabled)
    inputs.property('codeOnly', gemmaCodeOnly)
    if (speechEnabled && !gemmaCodeOnly && modelRoot.isPresent()) inputs.dir(modelRoot)
    outputs.dir(generatedSpeechAssets)
    doLast {
        def target = generatedSpeechAssets.get().asFile
        delete target
        target.mkdirs()
        if (!speechEnabled || gemmaCodeOnly) return
        if (!modelRoot.isPresent()) throw new GradleException('Full speech APK requires -PspeechModelRoot=<verified speech model directory>')
        def lock = new groovy.json.JsonSlurper().parse(speechLock)
        def root = file(modelRoot.get())
        lock.files.each { item ->
            def source = new File(root, item.name)
            if (source.length() != item.bytes) throw new GradleException('Speech model size mismatch: ' + item.name)
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            def outputFile = new File(target, 'speech/files/' + item.name)
            outputFile.parentFile.mkdirs()
            source.withInputStream { input -> outputFile.withOutputStream { output ->
                byte[] buffer = new byte[1024 * 1024]; int count
                while ((count = input.read(buffer)) != -1) { output.write(buffer, 0, count); digest.update(buffer, 0, count) }
            } }
            if (digest.digest().encodeHex().toString() != item.sha256) throw new GradleException('Speech model checksum mismatch: ' + item.name)
        }
        new File(target, 'speech/manifest.json').text = groovy.json.JsonOutput.toJson(lock)
    }
}
android.sourceSets.main.assets.srcDir(generatedSpeechAssets)
tasks.named('preBuild').configure { dependsOn 'prepareSpeechAssets' }
