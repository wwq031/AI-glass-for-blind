name: CXR-L probe

on:
  pull_request:
    paths:
      - 'apps/device-experiment/android/**'
      - '.github/workflows/cxrl-probe.yml'
  push:
    branches: [main]
    paths:
      - 'apps/device-experiment/android/**'
      - '.github/workflows/cxrl-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Install SDK components
        run: sdkmanager 'platforms;android-36.1' 'build-tools;35.0.0'
      - name: Build, replay SDK callbacks and lint
        run: gradle -p apps/device-experiment/android -PcxrlProbeOnly=true :phone-l:assembleDebug :phone-l:testDebugUnitTest :phone-l:lintDebug --console=plain
