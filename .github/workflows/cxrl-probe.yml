name: CXR-L probe

on:
  pull_request:
    paths:
      - 'apps/device-experiment/android/**'
      - 'apps/phone-companion/android/src/main/java/com/leqi/experiment/phonebt/Gemma*.kt'
      - '.github/workflows/cxrl-probe.yml'
  push:
    branches: [main]
    paths:
      - 'apps/device-experiment/android/**'
      - 'apps/phone-companion/android/src/main/java/com/leqi/experiment/phonebt/Gemma*.kt'
      - '.github/workflows/cxrl-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Install SDK components
        run: sdkmanager 'platforms;android-36.1' 'build-tools;35.0.0'
      - name: Build, replay SDK callbacks and lint
        # CI checks the actual Gemma code path without downloading 2GB per change.
        # These APKs have no weights and are never uploaded as complete releases.
        run: gradle -p apps/device-experiment/android -PcxrlProbeOnly=true -PcxrlGemma=true -PgemmaCodeOnly=true -PleqiSourceRevision="$GITHUB_SHA" :phone-l:assembleDebug :phone-l:testDebugUnitTest :phone-l:lintDebug --console=plain
